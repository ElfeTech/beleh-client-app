name: Prod release build

on:
  push:
    branches:
      - prod

concurrency:
  group: prod-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  bump-version-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump package version (patch)
        id: bump
        run: |
          NEW_VERSION=$(node scripts/release-bump-version.mjs)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Build
        env:
          VITE_APP_VERSION: ${{ steps.bump.outputs.version }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: beleh-frontend-dist
          path: dist
          if-no-files-found: error
